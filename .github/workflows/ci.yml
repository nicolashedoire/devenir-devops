name: Vérifier le parcours TaskBoard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publier l’image validée dans le registre GHCR
        required: true
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: parcours-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Application, PostgreSQL et restauration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: devenir-devops-ci-${{ github.run_id }}-${{ github.run_attempt }}
      APP_VERSION: 0.2.0
      APP_REVISION: ${{ github.sha }}
    steps:
      - name: Récupérer exactement la révision testée
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Préparer la version Node de référence
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Installer les dépendances verrouillées
        run: npm ci --ignore-scripts
      - name: Contrôler la machine et la documentation
        run: |
          mkdir -p preuves
          node scripts/check-env.mjs --docker --json > preuves/environnement.json
          npm run check:docs
      - name: Tester le serveur et vérifier les dépendances
        run: |
          npm test | tee preuves/tests.txt
          npm audit --omit=dev --audit-level=high
      - name: Tester la persistance après remplacement de l’API
        run: bash scripts/verify-compose.sh
      - name: Restaurer une sauvegarde dans une base distincte
        run: |
          bash scripts/backup-restore.sh
          mkdir -p preuves/restaurations
          for result in backups/*/resultat.json; do
            cp "$result" "preuves/restaurations/$(basename "$(dirname "$result")").json"
          done
      - name: Conserver exactement l’image testée
        if: github.event_name == 'workflow_dispatch' && inputs.publish_image && github.ref == 'refs/heads/main'
        run: |
          image_id=$(docker compose images -q api)
          test -n "$image_id"
          revision=$(docker image inspect "$image_id" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          test "$revision" = "$GITHUB_SHA"
          docker tag "$image_id" "taskboard-verified:$GITHUB_SHA"
          mkdir -p image-validation
          docker save "taskboard-verified:$GITHUB_SHA" | gzip > image-validation/taskboard.tar.gz
      - name: Transmettre l’image à la publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish_image && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-validee-${{ github.sha }}
          path: image-validation/taskboard.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Conserver le diagnostic
        if: always()
        run: |
          mkdir -p preuves
          docker compose ps -a > preuves/compose-etat.txt
          docker compose logs --no-color --tail=100 > preuves/compose-journaux.txt
          printf '%s\n' "$GITHUB_SHA" > preuves/revision.txt
      - name: Arrêter les services de ce test
        if: always()
        run: docker compose down --remove-orphans
      - name: Joindre les preuves à l’exécution
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-${{ github.sha }}
          path: preuves/
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publier uniquement une image déjà validée
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.publish_image && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Recevoir l’image du job de validation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-validee-${{ github.sha }}
          path: image-validation
      - name: Publier l’image testée sans la reconstruire
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repo}:sha-${GITHUB_SHA}"
          docker load --input image-validation/taskboard.tar.gz
          revision=$(docker image inspect "taskboard-verified:$GITHUB_SHA" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          test "$revision" = "$GITHUB_SHA"
          docker tag "taskboard-verified:$GITHUB_SHA" "$image"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker push "$image"
          reference=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          test -n "$reference"
          mkdir -p preuves-publication
          printf '%s\n' "$reference" > preuves-publication/image-digest.txt
          printf '%s\n' "$GITHUB_SHA" > preuves-publication/revision.txt
          printf '### Image publiée\n\n`%s`\n\nRévision : `%s`\n' "$reference" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Joindre la référence immuable publiée
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-${{ github.sha }}
          path: preuves-publication/
          retention-days: 90
          if-no-files-found: error
