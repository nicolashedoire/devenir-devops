name: Publier une image vérifiée sur deux architectures

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: image-multiarch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Vérifier ${{ matrix.arch }}
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: devenir-devops-${{ matrix.arch }}-${{ github.run_id }}
      APP_VERSION: 0.2.0
      APP_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Installer et vérifier
        run: |
          npm ci --ignore-scripts
          npm test
          npm run check:docs
          npm audit --omit=dev --audit-level=high
      - name: Exécuter PostgreSQL, migrations et restauration sur cette architecture
        run: |
          bash scripts/verify-compose.sh
          bash scripts/backup-restore.sh
          mkdir -p preuves/restaurations
          for result in backups/*/resultat.json; do
            cp "$result" "preuves/restaurations/$(basename "$(dirname "$result")").json"
          done
      - name: Transmettre exactement l’image testée
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image_id=$(docker compose images -q api)
          test -n "$image_id"
          test "$(docker image inspect "$image_id" --format '{{.Architecture}}')" = "$EXPECTED_ARCH"
          test "$(docker image inspect "$image_id" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          docker tag "$image_id" "taskboard-verified:$GITHUB_SHA"
          mkdir -p image-validation
          docker save "taskboard-verified:$GITHUB_SHA" | gzip > image-validation/taskboard.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.arch }}-${{ github.sha }}
          path: image-validation/taskboard.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Conserver les diagnostics et arrêter le laboratoire CI
        if: always()
        run: |
          mkdir -p preuves
          docker compose ps -a > preuves/compose-etat.txt
          docker compose logs --no-color --tail=100 > preuves/compose-journaux.txt
          printf '%s\n' "$GITHUB_SHA" > preuves/revision.txt
          docker compose down --remove-orphans
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verification-${{ matrix.arch }}-${{ github.sha }}
          path: preuves/
          retention-days: 30

  publish:
    name: Publier l’image validée ${{ matrix.arch }}
    needs: validate
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ matrix.arch }}-${{ github.sha }}
          path: image-validation
      - name: Publier sans reconstruire
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repo}:sha-${GITHUB_SHA}-${EXPECTED_ARCH}"
          docker load --input image-validation/taskboard.tar.gz
          test "$(docker image inspect "taskboard-verified:$GITHUB_SHA" --format '{{.Architecture}}')" = "$EXPECTED_ARCH"
          test "$(docker image inspect "taskboard-verified:$GITHUB_SHA" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          docker tag "taskboard-verified:$GITHUB_SHA" "$image"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker push "$image"
          reference=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          test -n "$reference"
          mkdir -p publication
          printf '%s\n' "$reference" > "publication/${EXPECTED_ARCH}.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}-${{ github.sha }}
          path: publication/
          retention-days: 90
          if-no-files-found: error

  manifest:
    name: Réunir les deux images validées
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*-${{ github.sha }}
          path: publication
          merge-multiple: true
      - name: Publier l’index immuable des images testées
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repo}:multi-${GITHUB_SHA}"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker buildx imagetools create --tag "$image" "$(cat publication/amd64.txt)" "$(cat publication/arm64.txt)"
          docker buildx imagetools inspect "$image" --raw > publication/manifest.json
          jq -e '.manifests | map(.platform.architecture) | sort == ["amd64","arm64"]' publication/manifest.json
          digest="sha256:$(sha256sum publication/manifest.json | cut -d' ' -f1)"
          docker buildx imagetools inspect "ghcr.io/${repo}@$digest" > publication/inspection.txt
          printf '%s\n' "ghcr.io/${repo}@$digest" > publication/image-digest.txt
          printf '%s\n' "$GITHUB_SHA" > publication/revision.txt
          printf '### Image multiarchitecture validée\n\n`%s`\n' "ghcr.io/${repo}@$digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-multiarch-${{ github.sha }}
          path: publication/
          retention-days: 90
          if-no-files-found: error
