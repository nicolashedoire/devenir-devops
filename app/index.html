<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskBoard — Laboratoire DevOps</title>
<style>
body{font:18px system-ui;color:#173341;background:#eef4f5;margin:0;padding:7vh 8vw}
main{max-width:760px;margin:auto}h1{font-size:46px}p{line-height:1.6}form{display:flex;gap:10px}
input{flex:1;min-width:0;padding:14px;border:1px solid #91abb2;border-radius:8px;font:inherit}
button{padding:12px 20px;background:#087f8c;color:white;border:0;border-radius:8px;font:inherit}
li{padding:16px;background:white;margin:10px 0;border-radius:8px}#status{min-height:28px}
</style><main><p>DEVENIR DEVOPS · PROJET FIL ROUGE</p><h1>TaskBoard</h1>
<p>Créez une tâche, observez la requête et suivez son trajet jusqu’aux données.</p>
<form id="form"><input id="title" aria-label="Titre de la tâche" maxlength="200" required>
<button>Ajouter</button></form><p id="status" role="status"></p><ul id="tasks"></ul>
<p>Laboratoire sans comptes utilisateurs. Le mode mémoire perd ses données à l’arrêt.</p></main>
<script>
const list=document.querySelector('#tasks'), status=document.querySelector('#status');
async function refresh(){const r=await fetch('/api/tasks');if(!r.ok)throw Error('Lecture impossible : '+r.status);
list.replaceChildren();for(const t of await r.json()){const li=document.createElement('li');li.textContent=t.title;list.append(li);}}
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();try{
const title=document.querySelector('#title');const r=await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.value})});
if(!r.ok)throw Error('Création impossible : '+r.status);title.value='';await refresh();status.textContent='Tâche enregistrée.';
}catch(e){status.textContent=e.message;}});refresh().catch(e=>status.textContent=e.message);
</script></html>
