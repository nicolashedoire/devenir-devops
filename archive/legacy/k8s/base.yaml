# Laboratoire uniquement — base mono-instance
apiVersion: "v1"
kind: "Namespace"
metadata:
  name: "taskboard"
---
apiVersion: "v1"
kind: "Secret"
metadata:
  name: "database"
  namespace: "taskboard"
type: "Opaque"
stringData:
  DATABASE_URL: "postgres://taskboard:lab-only-change-me@postgres:5432/taskboard"
  POSTGRES_PASSWORD: "lab-only-change-me"
---
apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "postgres-data"
  namespace: "taskboard"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "1Gi"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "postgres"
  namespace: "taskboard"
spec:
  replicas: 1
  strategy:
    type: "Recreate"
  selector:
    matchLabels:
      app: "postgres"
  template:
    metadata:
      labels:
        app: "postgres"
    spec:
      containers:
        - name: "postgres"
          image: "postgres:17"
          env:
            - name: "POSTGRES_DB"
              value: "taskboard"
            - name: "POSTGRES_USER"
              value: "taskboard"
            - name: "POSTGRES_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "database"
                  key: "POSTGRES_PASSWORD"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: "data"
              mountPath: "/var/lib/postgresql/data"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command:
                - "pg_isready"
                - "-U"
                - "taskboard"
                - "-d"
                - "taskboard"
            initialDelaySeconds: 5
            periodSeconds: 3
      volumes:
        - name: "data"
          persistentVolumeClaim:
            claimName: "postgres-data"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "postgres"
  namespace: "taskboard"
spec:
  selector:
    app: "postgres"
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "taskboard"
  namespace: "taskboard"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: "taskboard"
  template:
    metadata:
      labels:
        app: "taskboard"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: "api"
          image: "taskboard:lab"
          imagePullPolicy: "IfNotPresent"
          ports:
            - containerPort: 3000
          env:
            - name: "DATABASE_URL"
              valueFrom:
                secretKeyRef:
                  name: "database"
                  key: "DATABASE_URL"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
            seccompProfile:
              type: "RuntimeDefault"
          startupProbe:
            httpGet:
              path: "/healthz"
              port: 3000
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: "/readyz"
              port: 3000
            timeoutSeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: "/healthz"
              port: 3000
            periodSeconds: 10
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "taskboard"
  namespace: "taskboard"
spec:
  selector:
    app: "taskboard"
  ports:
    - port: 80
      targetPort: 3000
