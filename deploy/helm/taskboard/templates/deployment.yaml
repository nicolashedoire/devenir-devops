apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskboard.name" . }}-api
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "taskboard.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "taskboard.selector" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/startup: {{ include (print $.Template.BasePath "/startup-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "taskboard.name" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: schema-ready
          image: {{ include "taskboard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "/app/checks/startup-check.mjs", "schema"]
          env:
            {{- include "taskboard.databaseEnv" . | nindent 12 }}
          securityContext:
            {{- include "taskboard.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          volumeMounts:
            - name: startup-check
              mountPath: /app/checks
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: api
          image: {{ include "taskboard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "taskboard.containerSecurity" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            {{- include "taskboard.databaseEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: startup-check
          configMap:
            name: {{ include "taskboard.name" . }}-startup
        - name: tmp
          emptyDir: {}
