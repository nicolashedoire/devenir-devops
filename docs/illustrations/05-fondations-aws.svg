<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1570" viewBox="0 0 1600 1570" role="img" aria-labelledby="title desc">
  <title id="title">Les fondations AWS du laboratoire TaskBoard</title>
  <desc id="desc">Un VPC 10.42.0.0/16 comprend deux zones, chacune avec un sous-réseau public et un privé. La table publique partagée possède une route vers Internet Gateway ; les tables privées n’ont que la route locale. Les groupes de sécurité déclarent une connexion TCP 5432 du groupe applicatif vers le groupe base. Les emplacements des services futurs sont en pointillés. Aucune instance de calcul, base RDS, passerelle NAT ni adresse IPv4 publique automatique n’est créée.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#476875" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#147d83" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #183b4a; }
      .title { font-size: 44px; font-weight: 700; }
      .subtitle { font-size: 26px; fill: #526c77; }
      .heading { font-size: 30px; font-weight: 700; }
      .body { font-size: 25px; }
      .small { font-size: 23px; fill: #526c77; }
      .overline { font-size: 22px; letter-spacing: 1.7px; font-weight: 700; fill: #526c77; }
      .route { fill: none; stroke: #476875; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .association { fill: none; stroke: #87a6ad; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1600" height="1570" fill="#ffffff"/>
  <text class="overline" x="70" y="48">DEVENIR DEVOPS · JALON 05</text>
  <text class="title" x="70" y="107">Un réseau préparé, des services à venir</text>
  <text class="subtitle" x="70" y="149">Région eu-west-3 · architecture de l’exemple · ressources déclarées dans infra/foundations</text>

  <g id="internet">
    <rect x="670" y="185" width="260" height="58" rx="29" fill="#ffffff" stroke="#9cafb6" stroke-width="2"/>
    <text class="heading" x="800" y="224" text-anchor="middle">Internet</text>
  </g>

  <g id="vpc">
    <rect x="50" y="280" width="1500" height="1100" rx="24" fill="#fafcfc" stroke="#183b4a" stroke-width="3"/>
    <text class="heading" x="84" y="327">VPC · 10.42.0.0/16</text>
    <text class="small" x="84" y="363">Réseau propre au laboratoire</text>

    <g id="passerelle-internet">
      <rect x="615" y="290" width="370" height="92" rx="14" fill="#ffffff" stroke="#9cafb6" stroke-width="2"/>
      <text class="heading" x="800" y="329" text-anchor="middle">Internet Gateway</text>
      <text class="small" x="800" y="364" text-anchor="middle">IGW attachée au VPC</text>
      <path class="route" d="M 800 290 V 249" marker-end="url(#arrow)"/>
    </g>

    <g id="table-publique">
      <rect x="515" y="428" width="570" height="96" rx="14" fill="#f4f7f8" stroke="#9cafb6" stroke-width="2"/>
      <text class="heading" x="800" y="468" text-anchor="middle">Table publique partagée</text>
      <text class="body" x="800" y="507" text-anchor="middle">Route 0.0.0.0/0 → IGW</text>
      <path class="route" d="M 800 428 V 389" marker-end="url(#arrow)"/>
    </g>

    <g id="zone-a">
      <rect x="88" y="592" width="664" height="488" rx="18" fill="#ffffff" stroke="#c9d8dd" stroke-width="2"/>
      <text class="heading" x="117" y="630">Zone A · eu-west-3a</text>
      <g id="sous-reseau-public-a">
        <rect x="118" y="657" width="604" height="153" rx="12" fill="#f0f5f7" stroke="#a8bdc5" stroke-width="2"/>
        <text class="heading" x="147" y="698">Sous-réseau public A</text>
        <text class="body" x="147" y="742">10.42.0.0/24</text>
        <text class="small" x="147" y="781">Attribution automatique d’IPv4 publique : non</text>
      </g>
      <g id="sous-reseau-prive-a">
        <rect x="118" y="835" width="604" height="217" rx="12" fill="#edf7f7" stroke="#87b8bc" stroke-width="2"/>
        <text class="heading" x="147" y="876">Sous-réseau privé A</text>
        <text class="body" x="147" y="916">10.42.10.0/24</text>
        <text class="small" x="147" y="953">Table privée A : route locale uniquement</text>
        <rect x="145" y="974" width="550" height="57" rx="8" fill="#ffffff" stroke="#b1764b" stroke-width="2" stroke-dasharray="8 7"/>
        <text x="420" y="1010" text-anchor="middle" style="font-size:24px;fill:#945427">Emplacements futurs · aucun service déployé</text>
      </g>
    </g>

    <g id="zone-b">
      <rect x="848" y="592" width="664" height="488" rx="18" fill="#ffffff" stroke="#c9d8dd" stroke-width="2"/>
      <text class="heading" x="877" y="630">Zone B · eu-west-3b</text>
      <g id="sous-reseau-public-b">
        <rect x="878" y="657" width="604" height="153" rx="12" fill="#f0f5f7" stroke="#a8bdc5" stroke-width="2"/>
        <text class="heading" x="907" y="698">Sous-réseau public B</text>
        <text class="body" x="907" y="742">10.42.1.0/24</text>
        <text class="small" x="907" y="781">Attribution automatique d’IPv4 publique : non</text>
      </g>
      <g id="sous-reseau-prive-b">
        <rect x="878" y="835" width="604" height="217" rx="12" fill="#edf7f7" stroke="#87b8bc" stroke-width="2"/>
        <text class="heading" x="907" y="876">Sous-réseau privé B</text>
        <text class="body" x="907" y="916">10.42.11.0/24</text>
        <text class="small" x="907" y="953">Table privée B : route locale uniquement</text>
        <rect x="905" y="974" width="550" height="57" rx="8" fill="#ffffff" stroke="#b1764b" stroke-width="2" stroke-dasharray="8 7"/>
        <text x="1180" y="1010" text-anchor="middle" style="font-size:24px;fill:#945427">Emplacements futurs · aucun service déployé</text>
      </g>
    </g>

    <!-- Deux associations vers une table publique partagée ; les traits passent à droite des titres. -->
    <path class="route" d="M 680 652 V 564 H 800 V 531" marker-end="url(#arrow)"/>
    <path class="route" d="M 1450 652 V 564 H 800"/>
    <circle cx="800" cy="564" r="5" fill="#476875"/>

    <!-- Un groupe de placement RDS lie les deux sous-réseaux privés. -->
    <path class="association" d="M 420 1052 V 1099 H 1180 V 1052"/>
    <path class="association" d="M 800 1099 V 1115"/>
    <text class="body" x="800" y="1145" text-anchor="middle">Groupe de sous-réseaux RDS : les deux privés · aucune instance RDS</text>

    <g id="groupes-securite">
      <text class="overline" x="118" y="1200">RÈGLES DÉCLARÉES · GROUPES ENCORE SANS SERVICES</text>
      <rect x="118" y="1226" width="455" height="115" rx="14" fill="#edf7f7" stroke="#147d83" stroke-width="2"/>
      <text class="heading" x="147" y="1271">Groupe applicatif</text>
      <text class="small" x="147" y="1310">Aucune entrée déclarée</text>
      <rect x="1027" y="1226" width="455" height="115" rx="14" fill="#edf7f7" stroke="#147d83" stroke-width="2"/>
      <text class="heading" x="1056" y="1271">Groupe base de données</text>
      <text class="small" x="1056" y="1310">Entrée depuis le groupe applicatif</text>
      <path d="M 584 1281 H 1015" fill="none" stroke="#147d83" stroke-width="3.5" marker-end="url(#arrow-teal)"/>
      <text class="heading" x="800" y="1265" text-anchor="middle">TCP 5432</text>
      <text class="small" x="800" y="1320" text-anchor="middle">Sortie applicative + entrée base</text>
    </g>
  </g>

  <text class="small" x="800" y="1419" text-anchor="middle">Après application : table par défaut locale uniquement ; groupe de sécurité par défaut fermé.</text>
  <rect x="70" y="1447" width="1460" height="91" rx="12" fill="#f4f7f8"/>
  <text x="800" y="1484" text-anchor="middle" style="font-size:26px;font-weight:700">Ni NAT, ni machine de calcul, ni instance RDS ne sont créés à ce jalon.</text>
  <text class="small" x="800" y="1520" text-anchor="middle">Les pointillés montrent des emplacements futurs, pas des ressources déjà exécutées.</text>
</svg>
