receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 1s
    send_batch_size: 256
exporters:
  otlp_http/tempo:
    endpoint: http://tempo:4318
    sending_queue:
      queue_size: 1000
    retry_on_failure:
      enabled: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    sending_queue:
      queue_size: 1000
    retry_on_failure:
      enabled: true
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
