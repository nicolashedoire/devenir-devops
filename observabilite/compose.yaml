name: taskboard-observabilite

# Identifiants publics réservés à ce laboratoire local.
x-api: &api
  image: taskboard-observabilite:local
  build:
    context: ..
    dockerfile: observabilite/Dockerfile
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 256m
  environment: &api-env
    DATABASE_URL: postgres://lab_reader:lab-observation-public@db:5432/taskboard
    LAB_MODE: "true"
    HOST: 0.0.0.0
    PORT: "3000"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
    OTEL_BSP_SCHEDULE_DELAY: "1000"
    OTEL_METRICS_EXPORTER: none
  depends_on:
    db:
      condition: service_healthy
    collector:
      condition: service_started
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
    interval: 5s
    timeout: 3s
    retries: 20
  stop_grace_period: 15s

services:
  db:
    image: postgres:17@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232
    environment:
      POSTGRES_USER: taskboard
      POSTGRES_DB: taskboard
      POSTGRES_PASSWORD: lab-only-change-me
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"]
      interval: 3s
      timeout: 2s
      retries: 30
  api:
    <<: *api
    environment:
      <<: *api-env
      OBS_SCENARIO: normal
      FAULT_MODE: "off"
    ports: ["127.0.0.1:3010:3000"]
  api-lente:
    <<: *api
    environment:
      <<: *api-env
      OBS_SCENARIO: lent
      FAULT_MODE: slow
    ports: ["127.0.0.1:3011:3000"]
  api-erreur:
    <<: *api
    environment:
      <<: *api-env
      OBS_SCENARIO: erreur
      FAULT_MODE: error
    ports: ["127.0.0.1:3012:3000"]
  collector:
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro
    ports: ["127.0.0.1:13133:13133"]
    mem_limit: 256m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: [tempo, loki]
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=24h"]
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./alertes.yaml:/etc/prometheus/alertes.yaml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    mem_limit: 256m
  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports: ["127.0.0.1:3100:3100"]
    mem_limit: 384m
  tempo:
    image: grafana/tempo:3.0.3@sha256:0296560ac66f8a3600d7fb3014a52c189d4d9c3549ad6ff441bf2409855d68d5
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports: ["127.0.0.1:3200:3200"]
    mem_limit: 512m
  grafana:
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_SECURITY_ADMIN_PASSWORD: lab-observation-public
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3300:3000"]
    mem_limit: 384m
    depends_on: [prometheus, loki, tempo]

volumes:
  postgres-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
