global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alertes.yaml
scrape_configs:
  - job_name: taskboard
    static_configs:
      - targets: ["api:3000"]
        labels:
          scenario: normal
      - targets: ["api-lente:3000"]
        labels:
          scenario: lent
      - targets: ["api-erreur:3000"]
        labels:
          scenario: erreur
